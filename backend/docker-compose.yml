services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    volumes:
      - .:/app:z
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    volumes:
      - .:/app:z
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.workers.main worker --loglevel=info

  celery_beat:
    build: .
    volumes:
      - .:/app:z
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.workers.main beat --loglevel=info

volumes:
  postgres_data:
